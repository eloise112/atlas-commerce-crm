    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Rajdhani', sans-serif;
        background-color: #050505;
        color: #e0f2fe;
        overflow-x: hidden;
      }
      h1, h2, h3, h4, h5, h6, .font-sci-fi {
        font-family: 'Orbitron', sans-serif;
      }
      
      /* Scrollbar Styling */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0f172a; 
      }
      ::-webkit-scrollbar-thumb {
        background: #0ea5e9; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #0284c7; 
      }

      /* --- Animations Utility Classes --- */
      
      /* Standard Fade In */
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }

      /* Fade In Up */
      @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
      .animate-fade-in-up { animation: fadeInUp 0.5s ease-out forwards; }

      /* Fade In Down */
      @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
      .animate-fade-in-down { animation: fadeInDown 0.5s ease-out forwards; }
      
      /* Fade In Left */
      @keyframes fadeInLeft { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
      .animate-fade-in-left { animation: fadeInLeft 0.5s ease-out forwards; }

      /* Pulse Slow */
      @keyframes pulseSlow { 
        0%, 100% { opacity: 1; } 
        50% { opacity: 0.5; } 
      }
      .animate-pulse-slow { animation: pulseSlow 3s cubic-bezier(0.4, 0, 0.6, 1) infinite; }

      /* Glow Text Effect */
      .glow-text {
        text-shadow: 0 0 10px rgba(6, 182, 212, 0.5), 0 0 20px rgba(6, 182, 212, 0.3);
      }
      
      /* Spin Slow */
      @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      .group-hover\:animate-spin-slow:hover { animation: spin 3s linear infinite; }


      /* --- Custom HUD Animations --- */

      /* Scanline Effect - A moving bar going down */
      @keyframes scanline-move {
        0% { top: -20%; opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { top: 120%; opacity: 0; }
      }
      .scanline {
        position: absolute;
        width: 100%;
        height: 100%;
        pointer-events: none;
        overflow: hidden;
      }
      .scanline::after {
        content: '';
        position: absolute;
        left: 0;
        right: 0;
        height: 15vh; /* Height of the scan beam */
        background: linear-gradient(to bottom, transparent, rgba(6, 182, 212, 0.2) 50%, transparent);
        box-shadow: 0 0 20px rgba(6, 182, 212, 0.1);
        animation: scanline-move 8s linear infinite;
        z-index: 50;
      }

      /* Floating Animation */
      @keyframes hud-float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      .animate-hud-float {
        animation: hud-float 6s ease-in-out infinite;
      }

      /* Marquee Animation for Text Overflow */
      @keyframes hud-marquee {
        0% { transform: translateX(100%); }
        100% { transform: translateX(-100%); }
      }
      .animate-hud-marquee {
        display: inline-block;
        white-space: nowrap;
        animation: hud-marquee 8s linear infinite;
        padding-left: 100%; 
      }
    </style>
